<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИП Ушатов Д. О. — приложения</title>
<meta name="description" content="Приложения ИП Ушатов Д. О.: игра «Палка» для Android.">
<!-- Самодостаточная, как и политика: без внешних шрифтов, скриптов и
     счётчиков — сайт нужен магазину и модератору, следить за ними незачем -->
<style>
  :root { --bg: #f3ede2; --sheet: #fbf7ef; --line: #e3d9c6; --ink: #2b2620; --meta: #6e604f; --link: #1a5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --sheet: #211d17; --line: #3a3228; --ink: #ece4d6; --meta: #a8998a; --link: #8ab4f8; }
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 -apple-system, "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  main { box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
  .meta { color: var(--meta); margin: 0 0 24px; font-size: 15px; }
  section { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
  h2 { font-size: 21px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Приложения</h1>
  <p class="meta">ИП Ушатов Д.&nbsp;О. · kubatura.app@mail.ru</p>
  <section>
    <h2>Палка</h2>
    <p>Игра для Android. Раз в сутки палку можно ткнуть. Раз в год палка стреляет.</p>
    <p><a href="palka/privacy.html">Политика конфиденциальности</a></p>
  </section>
</main>
</body>
</html>
